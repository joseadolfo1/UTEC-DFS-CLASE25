# =====================================================================
# Extra 1 - Que el pipeline construya y publique la imagen Docker
# Destino: .github/workflows/docker-publish.yml
# Requiere: el Dockerfile MULTI-ETAPA (clase 24, extra 1) y los secretos
#           DOCKERHUB_USUARIO y DOCKERHUB_TOKEN.
# Completa los 4 TODO. Solucion en ../final/docker-publish.yml
# =====================================================================
name: Publicar imagen

on:
  push:
    # TODO 1: solo cuando cambia la rama principal. Un pull request nunca publica.
    branches: [main]
  workflow_dispatch:

jobs:
  probar:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew build --console=plain
        shell: bash 

  publicar:
    runs-on: ubuntu-latest
    # TODO 2: este job NO debe empezar si el job "probar" fallo
    needs: [probar]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          # TODO 3: usuario y token desde los secretos del repositorio
          username: ${{ secrets.DOCKERHUB_USUARIO }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # TODO 4: dos nombres para la misma imagen:
          #   USUARIO/shopeasy:latest
          #   USUARIO/shopeasy:<codigo del commit>   (pista: github.sha)
          tags: |
            ${{ secrets.DOCKERHUB_USUARIO }}/shopeasy:latest
            ${{ secrets.DOCKERHUB_USUARIO }}/shopeasy:${{ github.sha }}
