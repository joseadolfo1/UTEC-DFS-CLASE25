# ==========================================
# Base de datos MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/shopeasy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ==========================================
# JWT
# ==========================================
# IMPORTANTE: Cambia este secret en produccion por uno generado de forma segura
jwt.secret=shopeasy_super_secret_key_for_jwt_signing_and_verifying_tokens_course_2024
# Expiracion en milisegundos: 86400000 = 24 horas
jwt.expiration=86400000

# ==========================================
# Swagger / OpenAPI
# ==========================================
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# Servidor
# ==========================================
server.port=8080
